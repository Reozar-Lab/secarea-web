<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wiki · 匿境 Secarea</title>
    <style>
        /* 重置页面，取消所有默认边距和滚动条 */
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background-color: #141414; /* 默认深色背景，防止加载时白屏闪烁 */
        }
        
        /* iframe 填满整个屏幕 */
        iframe { 
            width: 100vw; 
            height: 100vh; 
            border: none; 
            display: block; 
        }
    </style>
</head>
<body>
    <!-- 直接全屏加载 Quartz -->
    <iframe src="https://wiki.secarea.de5.net"></iframe>

    <!-- 注意：这里不再引入主站的 layout.js 和 common.js，避免样式和脚本冲突 -->
</body>
</html>
