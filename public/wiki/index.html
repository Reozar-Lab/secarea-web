<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wiki · 匿境 Secarea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../style.css">
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #141414; }
        /* iframe 占满整个屏幕，顶栏会悬浮在它上面 */
        #wiki-frame { width: 100vw; height: 100vh; border: none; }
    </style>
</head>
<body class="page-ios min-h-screen relative">
    <!-- 必须引入 layout.js，它会产生顶栏和接收消息的逻辑 -->
    <script src="../common.js"></script>
    <script src="../layout.js"></script>

    <iframe id="wiki-frame" src="https://wiki.secarea.de5.net"></iframe>
</body>
</html>
