<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>维基百科 | 匿境 Secarea</title>
    <!-- 引入主站全局样式和 Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-[#111] text-white overflow-hidden">
    
    <!-- 移除 pt-14，让 iframe 真正全屏，由主站 layout.js 注入的 fixed 顶栏覆盖在它上面 -->
    <div class="w-full h-screen">
        <!-- 你的 Wiki 地址 -->
        <iframe 
            id="wiki-frame" 
            src="https://wiki.secarea.de5.net" 
            class="w-full h-full border-none bg-[#111]"
            allow="clipboard-read; clipboard-write"
        ></iframe>
    </div>

    <!-- 引入主站全局逻辑（负责顶栏、侧边栏、加载动画、跨域通信） -->
    <script src="/layout.js"></script>
</body>
</html>
