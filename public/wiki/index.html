<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>维基百科 | 匿境 Secarea</title>
    <!-- 引入主站全局样式和 Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-[#111] text-white overflow-hidden">
    
    <!-- pt-14 (56px) 完美避开主站固定导航栏，h-screen 占满屏幕 -->
    <div class="w-full h-screen pt-14">
        <!-- 如果你的主站域名叫 secarea.de5.net，这里的 src 就填 Wiki 的子域名 -->
        <iframe 
            id="wiki-frame" 
            src="https://wiki.secarea.de5.net" 
            class="w-full h-full border-none bg-[#111]"
            allow="clipboard-read; clipboard-write"
        ></iframe>
    </div>

    <!-- 引入主站全局逻辑（负责顶栏、侧边栏、加载动画） -->
    <script src="/layout.js"></script>
</body>
</html>
