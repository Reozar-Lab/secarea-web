<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wiki · 匿境 Secarea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../style.css">
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #141414; }
        /* 强制 iframe 在底层 */
        #wiki-frame { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw; 
            height: 100vh; 
            border: none; 
            z-index: 1; /* 保持比 header 的 999 小 */
        }
    </style>
</head>
<body class="page-ios relative">

    <script src="../common.js"></script>
    <script src="../layout.js"></script>

    <!-- iframe 绝对定位在底层 -->
    <iframe id="wiki-frame" src="https://wiki.secarea.de5.net"></iframe>

</body>
</html>
