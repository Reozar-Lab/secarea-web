<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 · 匿境 Secarea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../style.css">
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <style>
        html, body { background-color: #141414; margin: 0; padding: 0; }
        .input-error { border-color: #ef4444 !important; }
        html:not(.dark) .bg-\[\#f4f4f5\] { background-color: #f4f4f5 !important; }
        html:not(.dark) .bg-white { background-color: #ffffff !important; }
        html:not(.dark) input { background-color: #ffffff !important; color: #000000 !important; }
        html:not(.dark) .text-black { color: #000000 !important; }
        html:not(.dark) .text-gray-700 { color: #374151 !important; }
        html:not(.dark) .text-gray-500 { color: #6b7280 !important; }
        html:not(.dark) .border-gray-200 { border-color: #e5e7eb !important; }
    </style>
</head>
<body class="text-gray-900 min-h-screen flex flex-col relative bg-[#141414] bg-grid">

    <div class="fixed top-14 w-full h-[45vh] flex flex-col items-center justify-center z-0 pointer-events-none">
        <h1 class="text-6xl font-serif font-bold text-gold-bright tracking-[0.3em] mb-4">注册</h1>
        <p class="text-xl text-[#c89f5d] tracking-[0.5em] uppercase font-roman">Register</p>
    </div>

    <div class="relative w-full flex-grow z-10 pt-14">
        <div class="w-full h-[45vh]"></div>
        <div class="w-full bg-[#f4f4f5] rounded-t-[3rem] pt-12 pb-32 flex flex-col items-center shadow-[0_-15px_40px_rgba(0,0,0,0.6)]">
            
            <div class="w-[85%] max-w-md flex flex-col gap-5">
                <form class="w-full flex flex-col gap-4 mt-2" onsubmit="return false;">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2 font-serif tracking-widest">用户名</label>
                        <input type="text" id="reg-name" placeholder="请输入用户名" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black transition-colors shadow-sm">
                        <p id="name-error" class="text-red-500 text-xs mt-1 hidden"></p>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2 font-serif tracking-widest">邮箱</label>
                        <input type="email" id="reg-email" placeholder="输入你的邮箱地址" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black transition-colors shadow-sm">
                        <p id="email-error" class="text-red-500 text-xs mt-1 hidden"></p>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2 font-serif tracking-widest">邮箱验证码</label>
                        <div class="flex gap-3">
                            <div class="w-full relative">
                                <input type="text" id="reg-otp" placeholder="6位数字验证码" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black transition-colors shadow-sm">
                                <p id="otp-error" class="text-red-500 text-xs mt-1 hidden"></p>
                            </div>
                            <button type="button" id="get-code-btn" class="whitespace-nowrap px-4 py-3 h-[46px] bg-white border border-gray-200 text-gray-700 text-sm font-bold rounded-xl hover:bg-gray-50 transition-colors shadow-sm">
                                获取验证码
                            </button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2 font-serif tracking-widest">安全验证</label>
                        <div class="flex gap-3">
                            <div class="w-full relative">
                                <input type="text" id="reg-captcha-input" placeholder="输入右侧字符" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black transition-colors shadow-sm">
                                <p id="captcha-error" class="text-red-500 text-xs mt-1 hidden"></p>
                            </div>
                            <div id="captcha-box" class="w-32 h-[46px] bg-[#e5e7eb] rounded-xl flex items-center justify-center cursor-pointer select-none overflow-hidden relative shrink-0">
                                <span id="captcha-text" class="text-xl font-roman font-black text-gray-800 tracking-widest italic line-through decoration-gray-400 decoration-2" style="transform: rotate(-5deg);">A1B2</span>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2 font-serif tracking-widest">密码</label>
                        <input type="password" id="reg-password" placeholder="设置密码" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black transition-colors shadow-sm">
                        <p id="password-error" class="text-red-500 text-xs mt-1 hidden"></p>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2 font-serif tracking-widest">确认密码</label>
                        <input type="password" id="reg-confirm-password" placeholder="再次输入密码" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black transition-colors shadow-sm">
                        <p id="confirm-error" class="text-red-500 text-xs mt-1 hidden"></p>
                    </div>

                    <button type="button" id="submit-register" class="w-full mt-4 py-3.5 bg-[#111111] text-[#f5d78d] font-bold rounded-xl hover:bg-black transition-colors interactive-btn shadow-md">
                        建立档案
                    </button>
                </form>

                <div class="text-center mt-6">
                    <span class="text-sm text-gray-500">已有档案？</span>
                    <a href="../login/index.html" class="text-sm font-bold text-black border-b border-black hover:text-gray-600 hover:border-gray-600 transition-colors ml-1 pb-0.5">返回登录</a>
                </div>
            </div>
        </div>
    </div>

    <script src="../common.js"></script>
    <script src="../layout.js"></script>
    <script>
        const captchaText = document.getElementById('captcha-text');
        const captchaBox = document.getElementById('captcha-box');
        function generateCaptcha() {
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let captcha = '';
            for (let i = 0; i < 4; i++) captcha += chars[Math.floor(Math.random() * chars.length)];
            captchaText.textContent = captcha;
        }
        generateCaptcha();
        captchaBox.addEventListener('click', generateCaptcha);

        const nameInput = document.getElementById('reg-name');
        const emailInput = document.getElementById('reg-email');
        const otpInput = document.getElementById('reg-otp');
        const captchaInput = document.getElementById('reg-captcha-input');
        const passwordInput = document.getElementById('reg-password');
        const confirmInput = document.getElementById('reg-confirm-password');
        
        const getCodeBtn = document.getElementById('get-code-btn');
        let countdown = 60; let timer = null;

        function showError(input, errorEl, msg) {
            input.classList.add('input-error');
            errorEl.textContent = msg;
            errorEl.classList.remove('hidden');
        }
        function clearError(input, errorEl) {
            input.classList.remove('input-error');
            errorEl.classList.add('hidden');
        }

        [nameInput, emailInput, otpInput, captchaInput, passwordInput, confirmInput].forEach((input, index) => {
            input.addEventListener('input', () => {
                const ids = ['name-error', 'email-error', 'otp-error', 'captcha-error', 'password-error', 'confirm-error'];
                clearError(input, document.getElementById(ids[index]));
            });
        });

        getCodeBtn.addEventListener('click', async () => {
            if (timer) return;
            const email = emailInput.value.trim();
            if (!email) return showError(emailInput, document.getElementById('email-error'), "请输入邮箱地址");

            getCodeBtn.textContent = '发送中...';

            try {
                const data = await API.sendCode(email);
                if (data.error) throw new Error(data.error);

                getCodeBtn.classList.add('opacity-50', 'cursor-not-allowed');
                timer = setInterval(() => {
                    countdown--;
                    if (countdown <= 0) {
                        clearInterval(timer); timer = null; countdown = 60;
                        getCodeBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                        getCodeBtn.textContent = `获取验证码`;
                    } else {
                        getCodeBtn.textContent = `${countdown}s 后重发`;
                    }
                }, 1000);

            } catch (error) {
                showError(emailInput, document.getElementById('email-error'), error.message || "发送失败");
                getCodeBtn.textContent = '获取验证码';
            }
        });

        const submitBtn = document.getElementById('submit-register');
        submitBtn.addEventListener('click', async () => {
            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const otp = otpInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmInput.value;
            const captchaInputValue = captchaInput.value.trim();

            let hasError = false;
            if (!name) { showError(nameInput, document.getElementById('name-error'), "请输入用户名"); hasError = true; }
            if (!email) { showError(emailInput, document.getElementById('email-error'), "请输入邮箱"); hasError = true; }
            if (!otp) { showError(otpInput, document.getElementById('otp-error'), "请输入验证码"); hasError = true; }
            if (!password) { showError(passwordInput, document.getElementById('password-error'), "请输入密码"); hasError = true; }
            if (!captchaInputValue) { showError(captchaInput, document.getElementById('captcha-error'), "请输入安全验证码"); hasError = true; }
            if (captchaInputValue && captchaInputValue.toUpperCase() !== captchaText.textContent.toUpperCase()) {
                showError(captchaInput, document.getElementById('captcha-error'), "图形验证码错误"); hasError = true;
            }
            if (password && confirmPassword && password !== confirmPassword) {
                showError(confirmInput, document.getElementById('confirm-error'), "两次输入的密码不一致"); hasError = true;
            }
            if (hasError) return;

            submitBtn.textContent = '正在建立档案...';
            submitBtn.disabled = true;

            try {
                const data = await API.register(name, email, password, otp);
                if (data.error) {
                    if (data.error.includes("邮箱") || data.error.includes("账号")) {
                        showError(emailInput, document.getElementById('email-error'), data.error);
                    } else if (data.error.includes("验证码")) {
                        showError(otpInput, document.getElementById('otp-error'), data.error);
                    } else {
                        showError(emailInput, document.getElementById('email-error'), data.error);
                    }
                    throw new Error(data.error);
                }
                window.location.href = '/login/'; 
            } catch (error) {
                console.error(error);
                submitBtn.textContent = '建立档案';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
