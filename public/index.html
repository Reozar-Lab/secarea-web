<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>匿境 · Secarea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="text-gray-900 min-h-screen flex flex-col relative">

    <div id="loading-screen" class="fixed inset-0 z-[9999] bg-[#252525] flex items-center justify-center">
        <div class="dot-grid">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
    </div>

    <header id="main-header" class="sticky top-0 z-50 w-full h-14 bg-[#252525] flex items-center">
        <div class="px-5 w-full flex items-center justify-between h-full">
            <a href="./index.html" class="flex items-center">
                <span class="logo-text text-xl font-black tracking-tighter pt-1">CEC</span>
            </a>
            <div class="flex items-center gap-2">
                <button id="menu-btn" class="text-[#f5d78d] p-2 hover:opacity-70 transition-opacity flex items-center justify-center interactive-btn">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>
        <div id="dropdown-menu" class="absolute top-[60px] right-4 w-44 rounded-2xl overflow-hidden shadow-2xl border border-white/10 z-50">
            <div class="absolute inset-0 bg-[#1f1f1f]/95 backdrop-blur-xl z-[-1]"></div>
            <div class="flex flex-col py-3 px-2 gap-1 font-sans">
                <!-- 注意这里的 id，用于 JS 动态替换文字 -->
                <a href="./login/index.html" id="nav-login-btn" class="block px-4 py-2 text-sm font-medium rounded-lg text-[#f5d78d] hover:bg-white/10 transition-colors">登录</a>
                <a href="#" class="block px-4 py-2 text-sm font-medium rounded-lg text-[#f5d78d] hover:bg-white/10 transition-colors">WIKI</a>
                <a href="#" class="block px-4 py-2 text-sm font-medium rounded-lg text-[#f5d78d] hover:bg-white/10 transition-colors">创作</a>
                <a href="#" class="block px-4 py-2 text-sm font-medium rounded-lg text-[#f5d78d] hover:bg-white/10 transition-colors">贴吧</a>
            </div>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center w-full pb-20 overflow-hidden">
        <section id="hero-section" class="w-full flex flex-col bg-neutral-400 -mt-[1px]">
            
            <div id="logo-card" class="bleed-card bg-[#252525] bg-grid rounded-b-[4rem] h-[25vh] flex flex-col items-center justify-center shadow-heavy relative z-10">
                <div class="absolute inset-x-2 bottom-2 top-0 border-x border-b border-[#f5d78d] rounded-b-[3.6rem] pointer-events-none opacity-90"></div>
                <div class="-translate-y-3 relative z-10 w-full flex justify-center">
                    <div id="logo-content" class="flex items-center justify-center gap-6 will-change-transform">
                        <img src="./image/cec.png" alt="CEC Logo" class="h-20 w-auto object-contain">
                        <div class="w-[2px] h-14 bg-white/20"></div>
                        <div class="flex flex-col justify-center items-center">
                            <h1 class="text-4xl font-serif font-bold text-gold-bright tracking-[0.2em] leading-none mb-2">匿境</h1>
                            <p class="text-lg text-gold-bright font-roman tracking-[0.3em] uppercase opacity-90">SECAREA</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bleed-card bg-[#f4f4f5] rounded-t-[4rem] pt-12 pb-12 mt-6 flex flex-col items-center relative z-0">
                <div class="w-[85%] max-w-lg flex flex-col gap-6 relative z-10">
                    <section class="w-full rounded-[2rem] bg-[#111111] p-8 shadow-md text-center relative overflow-hidden reveal">
                        <div class="absolute -right-4 -top-4 text-6xl font-roman text-white/5 pointer-events-none select-none">CEC</div>
                        <p class="text-xs text-gray-400 tracking-widest mb-6">镜像网站正在施工，可与 Reozor 联系</p>
                        <h2 class="text-base text-white font-serif tracking-widest mb-6">欢迎来到，另一个世界的终点。</h2>
                    </section>

                    <section class="w-full bg-white rounded-[2rem] p-8 shadow-sm reveal">
                        <h3 class="text-xl font-serif font-bold text-black mb-4 tracking-widest border-l-4 border-gray-800 pl-3">世界档案</h3>
                        <p class="text-sm text-gray-600 leading-loose text-justify">
                            在这颗星球隐秘的背面，存在着被称为「内界」的亚空间。自 1531 年《保密公约》签订以来，觉醒者与普通人类（沉睡者）被彻底隔绝。
                        </p>
                    </section>
                </div>

                <div class="w-[85%] max-w-lg mt-8 grid grid-cols-2 gap-4 relative z-30 mb-8">
                    <a href="#" class="bg-white p-6 rounded-2xl shadow-sm text-center flex flex-col items-center interactive-card">
                        <div class="font-serif font-bold text-black tracking-widest">探索百科</div>
                    </a>
                    <a href="#" class="bg-white p-6 rounded-2xl shadow-sm text-center flex flex-col items-center interactive-card">
                        <div class="font-serif font-bold text-black tracking-widest">阅览创作</div>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-[#181818] py-8 border-t border-white/5 z-10 relative">
        <div class="px-5 flex flex-col items-center gap-5">
            <div class="text-[11px] text-[#c89f5d] tracking-wide mt-2 font-roman text-center">
                © 2026 Reozor Lab. CC-BY-SA 4.0
            </div>
        </div>
    </footer>

    <!-- 引入 API 公共文件 -->
    <script src="./common.js"></script>
    <script>
        window.addEventListener('load', () => {
            const loader = document.getElementById('loading-screen');
            setTimeout(() => { loader.classList.add('hidden-loader'); }, 800); 
        });

        const header = document.getElementById('main-header');
        const menuBtn = document.getElementById('menu-btn');
        const dropdownMenu = document.getElementById('dropdown-menu');
        const logoContent = document.getElementById('logo-content');

        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            if (scrollY > 100) {
                header.classList.add('header-scrolled');
                dropdownMenu.classList.remove('active');
            } else {
                header.classList.remove('header-scrolled');
            }
            if (scrollY > 0) {
                const scale = Math.max(0.7, 1 - (scrollY / 300));
                logoContent.style.transform = `scale(${scale})`;
            } else {
                logoContent.style.transform = `scale(1)`;
            }
        });

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            dropdownMenu.classList.toggle('active');
        });
        document.addEventListener('click', (e) => {
            if (!dropdownMenu.contains(e.target) && !menuBtn.contains(e.target)) {
                dropdownMenu.classList.remove('active');
            }
        });

        // 检查登录状态
        async function checkAuth() {
            try {
                const data = await API.getMe();
                if (data && data.user) {
                    const loginBtn = document.getElementById('nav-login-btn');
                    if (loginBtn) {
                        loginBtn.textContent = `欢迎, ${data.user.name}`;
                        loginBtn.href = "#"; // 预留个人中心
                    }
                }
            } catch (error) {
                console.log("未登录");
            }
        }
        checkAuth();
    </script>
</body>
</html>
