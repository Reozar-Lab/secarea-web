<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理中枢 · 匿境 Secarea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../style.css">
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="page-ios min-h-screen flex flex-col relative">

    <main class="flex-grow flex flex-col items-center w-full pt-20 pb-20 px-4">
        <div class="w-full max-w-3xl mx-auto flex flex-col">
            
            <div class="mb-6 flex justify-between items-end">
                <div>
                    <!-- 强制使用 ios-title 锁死标题颜色 -->
                    <h1 class="text-3xl font-serif font-bold ios-title tracking-widest">管理中枢</h1>
                    <p class="text-sm text-gray-500 mt-1">CEC 内部最高权限控制台</p>
                </div>
                <span id="current-admin-role" class="px-3 py-1 rounded bg-[#f5d78d]/20 text-[#c89f5d] border border-[#f5d78d]/30 text-xs font-roman uppercase"></span>
            </div>

            <div class="w-full mb-6 relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <input type="text" id="search-input" placeholder="搜索用户名或邮箱..." class="admin-input w-full pl-11 pr-4 py-3 shadow-sm focus:outline-none focus:border-[#c89f5d]">
            </div>

            <div id="user-list-container" class="w-full flex flex-col gap-3">
                <!-- JS 动态注入卡片 -->
            </div>

        </div>
    </main>

    <script src="../common.js"></script>
    <script src="../layout.js"></script>
    <script>
        let allUsers = []; 
        let isCreator = false;

        async function initAdmin() {
            try {
                const me = await API.getMe();
                if (!me || !me.user) { window.location.href = '/login/'; return; }
                if (me.user.role !== 'creator' && me.user.role !== 'editor') {
                    alert("您没有权限访问此页面"); window.location.href = '/'; return;
                }
                
                isCreator = me.user.role === 'creator';
                document.getElementById('current-admin-role').textContent = `权限: ${me.user.role}`;

                const data = await API.getUsers();
                if (data.error) throw new Error(data.error);
                
                allUsers = data.users;
                renderUsers(allUsers);

            } catch (e) {
                console.error(e);
                alert("加载失败: " + e.message);
            }
        }

        function renderUsers(users) {
            const container = document.getElementById('user-list-container');
            
            if (users.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-10">没有找到匹配的用户</div>`;
                return;
            }

            container.innerHTML = users.map(user => {
                const isBanned = user.is_banned === 1;
                const roleColor = user.role === 'creator' ? 'text-[#c89f5d] bg-[#f5d78d]/10' : (user.role === 'editor' ? 'text-blue-500 bg-blue-500/10' : 'text-gray-500 bg-gray-500/10');
                const statusColor = isBanned ? 'bg-red-500' : 'bg-green-500';

                return `
                <div class="w-full ios-card rounded-xl overflow-hidden shadow-sm border transition-all">
                    <div class="flex items-center justify-between p-4 cursor-pointer hover:bg-black/5 dark:hover:bg-white/5 transition-colors" onclick="toggleAccordion('${user.id}')">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-gray-200 dark:bg-gray-800 flex items-center justify-center text-lg font-serif ios-title">
                                ${user.name.charAt(0).toUpperCase()}
                            </div>
                            <div class="flex flex-col">
                                <span class="font-bold text-base ios-text">${user.name}</span>
                                <span class="text-xs text-gray-500">${user.email}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="px-2 py-0.5 rounded text-[10px] uppercase font-bold ${roleColor}">${user.role}</span>
                            <div class="w-2 h-2 rounded-full ${statusColor}"></div>
                            <svg id="icon-${user.id}" class="w-5 h-5 text-gray-400 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>

                    <div id="content-${user.id}" class="accordion-content border-t ios-border">
                        <div class="p-4 flex flex-col gap-4">
                            <div class="text-xs text-gray-500 font-sans">
                                <p>用户 ID: ${user.id}</p>
                            </div>
                            
                            ${isCreator ? `
                            <div class="flex flex-col sm:flex-row gap-3">
                                <div class="flex-1">
                                    <label class="block text-xs text-gray-500 mb-1">修改角色</label>
                                    <select onchange="changeRole('${user.id}', this.value)" class="admin-input w-full px-3 py-2 text-sm focus:outline-none">
                                        <option value="user" ${user.role === 'user' ? 'selected' : ''}>普通用户 (user)</option>
                                        <option value="editor" ${user.role === 'editor' ? 'selected' : ''}>编者 (editor)</option>
                                        <option value="creator" ${user.role === 'creator' ? 'selected' : ''}>创作者 (creator)</option>
                                    </select>
                                </div>
                                
                                <div class="flex-1 flex items-end">
                                    <button onclick="toggleBan('${user.id}', ${user.is_banned})" class="w-full py-2 rounded-lg text-sm font-bold transition-colors ${isBanned ? 'bg-green-500 text-white hover:bg-green-600' : 'bg-red-500 text-white hover:bg-red-600'}">
                                        ${isBanned ? '解除封禁' : '封禁该用户'}
                                    </button>
                                </div>
                            </div>
                            ` : `
                            <div class="text-xs text-gray-400 py-2">只有 Creator 可以修改用户权限或封禁。</div>
                            `}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function toggleAccordion(userId) {
            const content = document.getElementById(`content-${userId}`);
            const icon = document.getElementById(`icon-${userId}`);
            
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                icon.style.transform = 'rotate(0deg)';
            } else {
                content.classList.add('open');
                icon.style.transform = 'rotate(180deg)';
            }
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            const filtered = allUsers.filter(user => 
                user.name.toLowerCase().includes(keyword) || 
                user.email.toLowerCase().includes(keyword)
            );
            renderUsers(filtered);
        });

        async function changeRole(userId, newRole) {
            if (!confirm(`确定要将该用户的角色修改为 ${newRole} 吗？`)) {
                renderUsers(allUsers);
                return;
            }
            await API.updateUser(userId, newRole, undefined);
            const user = allUsers.find(u => u.id === userId);
            if (user) user.role = newRole;
            renderUsers(allUsers);
            if (typeof showToast !== 'undefined') showToast("角色修改成功", "success");
        }

        async function toggleBan(userId, currentBanStatus) {
            const newStatus = currentBanStatus === 1 ? 0 : 1;
            if (!confirm(`确定要${newStatus === 1 ? '封禁' : '解封'}该用户吗？`)) return;
            
            await API.updateUser(userId, undefined, newStatus);
            const user = allUsers.find(u => u.id === userId);
            if (user) user.is_banned = newStatus;
            renderUsers(allUsers);
            if (typeof showToast !== 'undefined') showToast(newStatus === 1 ? "用户已封禁" : "用户已解封", "success");
        }

        window.addEventListener('load', initAdmin);
    </script>
</body>
</html>
