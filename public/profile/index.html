<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 · 匿境 Secarea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../style.css">
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <style>
        body { background-color: #f2f2f7 !important; }
        html.dark body { background-color: #000000 !important; }
        #theme-toggle, #menu-btn { color: #f5d78d !important; }
        .ios-list-item:active { background-color: rgba(0, 0, 0, 0.05); }
        html.dark .ios-list-item:active { background-color: rgba(255, 255, 255, 0.05); }
        .user-name-color { color: #000000 !important; }
        html.dark .user-name-color { color: #ffffff !important; }
        .ios-card { background-color: #ffffff !important; }
        html.dark .ios-card { background-color: #1c1c1e !important; }
        .ios-text { color: #111111 !important; }
        html.dark .ios-text { color: #ffffff !important; }
        .ios-border { border-color: #e5e5ea !important; }
        html.dark .ios-border { border-color: #2c2c2e !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">

    <main class="flex-grow flex flex-col items-center w-full pt-20 pb-20 px-4">
        <div class="w-full max-w-lg flex flex-col" id="profile-container" style="opacity: 0; transition: opacity 0.5s;">
            
            <div class="flex flex-col items-center justify-center px-2 py-8">
                <div class="w-24 h-24 rounded-full bg-[#e5e5ea] dark:bg-[#1c1c1e] flex items-center justify-center shrink-0 shadow-sm mb-4 ios-border border transition-colors">
                    <span class="text-4xl font-serif text-black dark:text-[#f5d78d]" id="user-avatar-letter">?</span>
                </div>
                
                <div class="flex items-center gap-2 mb-1">
                    <h1 class="text-2xl font-bold tracking-wide user-name-color" id="user-name">加载中...</h1>
                    <span class="hidden px-2 py-0.5 rounded text-[10px] font-sans font-medium bg-gray-200 dark:bg-gray-800 text-gray-600 dark:text-gray-300" id="user-role">member</span>
                </div>
                
                <p class="text-sm font-sans text-gray-500 dark:text-gray-400 mt-1" id="user-email">---</p>
                <p class="text-xs font-sans text-gray-400 dark:text-gray-500 mt-1">ID: <span id="user-id">---</span></p>
            </div>

            <div class="w-full ios-card rounded-xl overflow-hidden shadow-sm mb-6 ios-border border">
                <a href="#" class="ios-list-item flex items-center justify-between px-4 py-3.5 ios-border border-b transition-colors">
                    <div class="flex items-center gap-3">
                        <div class="w-7 h-7 rounded-lg bg-blue-500 flex items-center justify-center text-white shrink-0">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                        </div>
                        <span class="text-[15px] font-medium ios-text">我的创作</span>
                    </div>
                    <svg class="w-5 h-5 text-gray-300 dark:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </a>
                <a href="#" class="ios-list-item flex items-center justify-between px-4 py-3.5 ios-border border-b transition-colors">
                    <div class="flex items-center gap-3">
                        <div class="w-7 h-7 rounded-lg bg-yellow-500 flex items-center justify-center text-white shrink-0">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                        </div>
                        <span class="text-[15px] font-medium ios-text">我的收藏</span>
                    </div>
                    <svg class="w-5 h-5 text-gray-300 dark:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </a>
                <a href="#" class="ios-list-item flex items-center justify-between px-4 py-3.5 transition-colors">
                    <div class="flex items-center gap-3">
                        <div class="w-7 h-7 rounded-lg bg-green-500 flex items-center justify-center text-white shrink-0">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                        </div>
                        <span class="text-[15px] font-medium ios-text">参与贡献</span>
                    </div>
                    <svg class="w-5 h-5 text-gray-300 dark:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </a>
            </div>

            <div id="admin-panel" class="hidden w-full ios-card rounded-xl overflow-hidden shadow-sm mb-6 ios-border border">
                <a href="/admin/" class="ios-list-item flex items-center justify-between px-4 py-3.5 transition-colors">
                    <div class="flex items-center gap-3">
                        <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-[#e8c88c] to-[#c89f5d] flex items-center justify-center text-black shrink-0 shadow-sm">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                        </div>
                        <span class="text-[15px] font-bold text-[#c89f5d]">CEC 管理中枢</span>
                    </div>
                    <svg class="w-5 h-5 text-gray-300 dark:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </a>
            </div>

            <div class="w-full ios-card rounded-xl overflow-hidden shadow-sm mb-6 ios-border border">
                <a href="#" class="ios-list-item flex items-center justify-between px-4 py-3.5 ios-border border-b transition-colors">
                    <div class="flex items-center gap-3">
                        <div class="w-7 h-7 rounded-lg bg-gray-400 flex items-center justify-center text-white shrink-0">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </div>
                        <span class="text-[15px] font-medium ios-text">账号安全</span>
                    </div>
                    <svg class="w-5 h-5 text-gray-300 dark:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </a>
                <a href="#" class="ios-list-item flex items-center justify-between px-4 py-3.5 transition-colors">
                    <div class="flex items-center gap-3">
                        <div class="w-7 h-7 rounded-lg bg-gray-400 flex items-center justify-center text-white shrink-0">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        </div>
                        <span class="text-[15px] font-medium ios-text">偏好设置</span>
                    </div>
                    <svg class="w-5 h-5 text-gray-300 dark:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </a>
            </div>

            <div class="w-full ios-card rounded-xl overflow-hidden shadow-sm ios-border border">
                <button id="profile-logout-btn" class="w-full flex items-center justify-center px-4 py-3.5 text-red-500 font-medium text-[15px] active:bg-gray-50 dark:active:bg-gray-800 transition-colors">
                    退出登录
                </button>
            </div>
        </div>
    </main>

    <script src="../common.js"></script>
    <script src="../layout.js"></script>
    <script>
        const container = document.getElementById('profile-container');
        const avatarLetter = document.getElementById('user-avatar-letter');
        const nameEl = document.getElementById('user-name');
        const roleEl = document.getElementById('user-role');
        const emailEl = document.getElementById('user-email');
        const idEl = document.getElementById('user-id');
        const adminPanel = document.getElementById('admin-panel');
        const logoutBtn = document.getElementById('profile-logout-btn');

        async function initProfile() {
            try {
                const data = await API.getMe();
                if (!data || !data.user) {
                    window.location.href = '/login/';
                    return;
                }
                const user = data.user;
                nameEl.textContent = user.name;
                emailEl.textContent = user.email;
                idEl.textContent = user.id.substring(0, 8).toUpperCase();
                avatarLetter.textContent = user.name.charAt(0).toUpperCase();

                if (user.role === 'creator' || user.role === 'editor') {
                    roleEl.textContent = user.role.toUpperCase();
                    roleEl.classList.remove('hidden');
                    if (user.role === 'creator') {
                        roleEl.className = 'px-2 py-0.5 rounded text-[10px] font-sans font-bold bg-[#f5d78d]/20 text-[#c89f5d] border border-[#f5d78d]/30';
                    } else {
                        roleEl.className = 'px-2 py-0.5 rounded text-[10px] font-sans font-bold bg-blue-500/20 text-blue-400 border border-blue-500/30';
                    }
                    adminPanel.classList.remove('hidden');
                }
                container.style.opacity = 1;
            } catch (error) {
                window.location.href = '/login/'; 
            }
        }

        logoutBtn.addEventListener('click', async () => {
            if (!confirm("确定要断开内界连接吗？")) return;
            logoutBtn.textContent = '正在断开...';
            try { await API.logout(); window.location.href = '/login/'; } catch (e) { alert("退出失败"); logoutBtn.textContent = '退出登录'; }
        });

        // ==========================================
        // 账号安全中心 (动态生成 UI 和逻辑)
        // ==========================================
        
        const securityModalHTML = `
        <div id="security-modal" class="fixed inset-0 z-[9999] bg-black/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300 flex items-end sm:items-center justify-center">
            <div class="w-full max-w-lg bg-[#f2f2f7] dark:bg-[#1c1c1e] rounded-t-3xl sm:rounded-3xl shadow-2xl transform translate-y-full sm:translate-y-0 sm:scale-95 transition-transform duration-300 max-h-[90vh] overflow-y-auto" id="security-panel">
                <div class="sticky top-0 bg-[#f2f2f7]/90 dark:bg-[#1c1c1e]/90 backdrop-blur z-10 px-4 py-4 border-b border-gray-200 dark:border-gray-800 flex justify-between items-center">
                    <h2 class="text-lg font-bold text-black dark:text-white">账号安全</h2>
                    <button id="close-security" class="text-gray-500 hover:text-black dark:hover:text-white p-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <div class="p-4 space-y-4">
                    <div class="bg-white dark:bg-[#2c2c2e] rounded-xl overflow-hidden p-4">
                        <h3 class="text-sm font-bold text-black dark:text-white mb-3">更改密码</h3>
                        <input type="password" id="old-password" placeholder="当前密码" class="w-full mb-2 px-3 py-2 bg-gray-50 dark:bg-[#1c1c1e] border border-gray-200 dark:border-gray-700 rounded-lg text-sm text-black dark:text-white focus:outline-none">
                        <input type="password" id="new-password" placeholder="新密码" class="w-full mb-3 px-3 py-2 bg-gray-50 dark:bg-[#1c1c1e] border border-gray-200 dark:border-gray-700 rounded-lg text-sm text-black dark:text-white focus:outline-none">
                        <button id="btn-change-password" class="w-full py-2 bg-[#111111] text-[#f5d78d] rounded-lg text-sm font-bold hover:bg-black transition">更新密码</button>
                    </div>

                    <div class="bg-white dark:bg-[#2c2c2e] rounded-xl overflow-hidden p-4">
                        <h3 class="text-sm font-bold text-black dark:text-white mb-3">更改注册邮箱</h3>
                        <div class="flex gap-2 mb-2">
                            <input type="email" id="new-email" placeholder="新邮箱地址" class="flex-1 px-3 py-2 bg-gray-50 dark:bg-[#1c1c1e] border border-gray-200 dark:border-gray-700 rounded-lg text-sm text-black dark:text-white focus:outline-none">
                            <button id="btn-send-email-code" class="whitespace-nowrap px-3 py-2 bg-gray-200 dark:bg-gray-700 text-black dark:text-white rounded-lg text-sm font-bold">获取验证码</button>
                        </div>
                        <input type="text" id="email-otp" placeholder="新邮箱收到的验证码" class="w-full mb-3 px-3 py-2 bg-gray-50 dark:bg-[#1c1c1e] border border-gray-200 dark:border-gray-700 rounded-lg text-sm text-black dark:text-white focus:outline-none">
                        <button id="btn-change-email" class="w-full py-2 bg-[#111111] text-[#f5d78d] rounded-lg text-sm font-bold hover:bg-black transition">确认更改</button>
                    </div>

                    <div class="bg-white dark:bg-[#2c2c2e] rounded-xl overflow-hidden">
                        <div class="p-4 flex justify-between items-center border-b border-gray-100 dark:border-gray-700">
                            <span class="text-sm font-medium text-black dark:text-white">GitHub 账号</span>
                            <span class="text-xs text-gray-500">未绑定 (开发中)</span>
                        </div>
                        <div class="p-4 flex justify-between items-center">
                            <span class="text-sm font-medium text-black dark:text-white">Google 账号</span>
                            <span class="text-xs text-gray-500">未绑定 (开发中)</span>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-[#2c2c2e] rounded-xl overflow-hidden mt-4">
                        <button id="btn-delete-account" class="w-full p-4 text-red-500 text-sm font-bold text-center hover:bg-red-50 dark:hover:bg-red-500/10 transition">
                            永久注销账号
                        </button>
                    </div>
                </div>
            </div>
        </div>
        `;
        document.body.insertAdjacentHTML('beforeend', securityModalHTML);

        const secModal = document.getElementById('security-modal');
        const secPanel = document.getElementById('security-panel');
        const closeSecBtn = document.getElementById('close-security');
        const securityEntryBtn = Array.from(document.querySelectorAll('.ios-list-item')).find(el => el.textContent.includes('账号安全'));

        function openSecurity() {
            secModal.classList.remove('hidden');
            setTimeout(() => {
                secModal.classList.remove('opacity-0');
                secPanel.classList.remove('translate-y-full', 'sm:scale-95');
            }, 10);
        }

        function closeSecurity() {
            secModal.classList.add('opacity-0');
            secPanel.classList.add('translate-y-full', 'sm:scale-95');
            setTimeout(() => secModal.classList.add('hidden'), 300);
        }

        if (securityEntryBtn) {
            securityEntryBtn.addEventListener('click', (e) => {
                e.preventDefault();
                openSecurity();
            });
        }
        closeSecBtn.addEventListener('click', closeSecurity);
        secModal.addEventListener('click', (e) => { if (e.target === secModal) closeSecurity(); });

        document.getElementById('btn-change-password').addEventListener('click', async (e) => {
            const oldPwd = document.getElementById('old-password').value;
            const newPwd = document.getElementById('new-password').value;
            if (!oldPwd || !newPwd) return showToast("请填写完整密码", "error");
            
            e.target.textContent = '处理中...';
            const res = await API.changePassword(oldPwd, newPwd);
            e.target.textContent = '更新密码';
            if (res.error) showToast(res.error, 'error');
            else {
                showToast("密码修改成功", "success");
                document.getElementById('old-password').value = '';
                document.getElementById('new-password').value = '';
            }
        });

        let emailTimer = null;
        document.getElementById('btn-send-email-code').addEventListener('click', async (e) => {
            if (emailTimer) return;
            const newEmail = document.getElementById('new-email').value.trim();
            if (!newEmail) return showToast("请输入新邮箱", "error");
            
            const res = await API.sendCode(newEmail);
            if (!res.error) {
                let count = 60;
                e.target.classList.add('opacity-50');
                emailTimer = setInterval(() => {
                    count--;
                    e.target.textContent = `${count}s`;
                    if (count <= 0) {
                        clearInterval(emailTimer); emailTimer = null;
                        e.target.classList.remove('opacity-50');
                        e.target.textContent = '获取验证码';
                    }
                }, 1000);
            }
        });

        document.getElementById('btn-change-email').addEventListener('click', async (e) => {
            const newEmail = document.getElementById('new-email').value.trim();
            const otp = document.getElementById('email-otp').value.trim();
            if (!newEmail || !otp) return showToast("请填写新邮箱和验证码", "error");
            
            e.target.textContent = '处理中...';
            const res = await API.changeEmail(newEmail, otp);
            e.target.textContent = '确认更改';
            if (res.error) showToast(res.error, 'error');
            else {
                showToast("邮箱更换成功", "success");
                setTimeout(() => window.location.reload(), 1500);
            }
        });

        document.getElementById('btn-delete-account').addEventListener('click', async () => {
            if (!confirm("⚠️ 警告：注销账号将永久删除你的所有数据，此操作不可逆！确定要继续吗？")) return;
            const confirmText = prompt("请输入 '确认注销' 四个字以执行操作：");
            if (confirmText !== "确认注销") return showToast("操作已取消", "info");

            const res = await API.deleteAccount();
            if (res.error) showToast(res.error, 'error');
            else {
                showToast("账号已注销，即将返回登录页", "success");
                setTimeout(() => window.location.href = '/login/', 1500);
            }
        });

        window.addEventListener('load', initProfile);
    </script>
</body>
</html>
