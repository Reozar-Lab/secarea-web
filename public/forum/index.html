<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>龙港 · 匿境 Secarea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../style.css">
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <style>
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="page-ios min-h-screen flex flex-col relative">

    <main id="feed" class="flex-grow w-full max-w-lg mx-auto pt-20 pb-12 px-3 space-y-3">
        <div id="feed-loading" class="ios-card rounded-2xl p-8 shadow-sm border ios-border text-center">
            <div class="inline-block w-6 h-6 border-2 border-[#c89f5d]/30 border-t-[#c89f5d] rounded-full animate-spin"></div>
            <p class="text-xs ios-text opacity-50 mt-3 tracking-widest">接入龙港通讯网...</p>
        </div>
    </main>

    <!-- 发布弹窗 -->
    <div id="publish-modal" class="fixed inset-0 z-[80] hidden items-center justify-center sys-modal-overlay">
        <div class="w-[90%] max-w-md rounded-2xl overflow-hidden sys-modal-panel shadow-2xl">
            <div class="px-5 py-3 sys-modal-header flex justify-between items-center">
                <h3 class="font-serif font-bold tracking-widest cec-text-dark text-sm">发布到龙港</h3>
                <button id="publish-close" class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
            </div>
            <div class="p-5 flex flex-col gap-3">
                <textarea id="publish-content" rows="5" maxlength="500" placeholder="在这片灰色地带，你想说些什么？"
                    class="w-full px-3 py-2.5 rounded-xl sys-modal-input text-sm outline-none resize-none"></textarea>
                <input type="url" id="publish-image" placeholder="图片链接（可选）"
                    class="w-full px-3 py-2.5 rounded-xl sys-modal-input text-sm outline-none">
                <div class="flex justify-between items-center mt-1">
                    <span id="publish-count" class="text-xs text-gray-400">0 / 500</span>
                    <button id="publish-submit"
                        class="px-5 py-2 bg-[#111111] text-[#f5d78d] font-bold rounded-xl hover:bg-[#252525] transition-colors text-sm tracking-widest">
                        发布
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="../common.js"></script>
    <script src="../layout.js"></script>
    <script>
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, s => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[s]));
        }

        function timeAgo(ts) {
            if (!ts) return '刚刚';
            const diff = Math.floor((Date.now() - ts) / 1000);
            if (diff < 60) return '刚刚';
            if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
            if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
            if (diff < 604800) return Math.floor(diff / 86400) + ' 天前';
            return new Date(ts).toLocaleDateString('zh-CN');
        }

        function roleBadge(role) {
            if (role === 'root') return '<span class="text-[9px] bg-red-500/20 text-red-500 px-1.5 py-0.5 rounded font-bold uppercase">ROOT</span>';
            if (role === 'admin') return '<span class="text-[9px] bg-yellow-500/20 text-yellow-600 px-1.5 py-0.5 rounded font-bold uppercase">ADMIN</span>';
            if (role === 'editor') return '<span class="text-[9px] bg-blue-500/20 text-blue-500 px-1.5 py-0.5 rounded font-bold uppercase">EDITOR</span>';
            return '';
        }

        function renderPost(post) {
            const initial = (post.authorName || '?').charAt(0).toUpperCase();
            return `
                <article class="ios-card rounded-2xl p-4 shadow-sm border ios-border">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="cec-avatar w-10 h-10 text-lg shrink-0">${escapeHtml(initial)}</div>
                        <div class="flex flex-col min-w-0">
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-sm cec-text-dark truncate">${escapeHtml(post.authorName)}</span>
                                ${roleBadge(post.authorRole)}
                            </div>
                            <span class="text-xs ios-text opacity-50 truncate">@${escapeHtml(post.authorName)} · ${timeAgo(post.createdAt)}</span>
                        </div>
                    </div>
                    <p class="text-sm ios-text leading-relaxed mb-3 whitespace-pre-wrap break-words">${escapeHtml(post.content)}</p>
                    ${post.imageUrl ? `<div class="w-full bg-gray-200 dark:bg-gray-800 rounded-xl mb-3 overflow-hidden border ios-border"><img src="${escapeHtml(post.imageUrl)}" class="w-full h-auto" alt=""></div>` : ''}
                    <div class="flex items-center justify-between ios-text opacity-50 text-xs px-2">
                        <button class="comment-btn flex items-center gap-1 hover:text-[#c89f5d] transition" data-id="${post.id}">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                            ${post.replies || 0}
                        </button>
                        <button class="repost-btn flex items-center gap-1 hover:text-[#c89f5d] transition" data-id="${post.id}">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            ${post.reposts || 0}
                        </button>
                        <button class="like-btn flex items-center gap-1 transition ${post.likedByMe ? 'text-red-500' : 'hover:text-red-500'}" data-id="${post.id}">
                            <svg class="w-4 h-4" fill="${post.likedByMe ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                            <span class="like-count">${post.likes || 0}</span>
                        </button>
                    </div>
                </article>
            `;
        }

        function renderEmpty() {
            return `
                <div class="ios-card rounded-2xl p-10 shadow-sm border ios-border text-center">
                    <div class="w-14 h-14 mx-auto mb-4 rounded-full bg-[#f5d78d]/10 flex items-center justify-center">
                        <svg class="w-7 h-7 text-[#c89f5d]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                    </div>
                    <p class="text-sm cec-text-dark font-bold tracking-widest mb-1">通讯网静默中</p>
                    <p class="text-xs ios-text opacity-50">还没有任何记录，成为第一个发帖的人。</p>
                </div>
            `;
        }

        async function loadFeed() {
            const feed = document.getElementById('feed');
            const loading = document.getElementById('feed-loading');
            try {
                const data = await API.getPosts(1, 20);
                if (loading) loading.remove();
                if (data && data.posts && data.posts.length > 0) {
                    feed.innerHTML = data.posts.map(renderPost).join('');
                    bindPostActions();
                } else {
                    feed.innerHTML = renderEmpty();
                }
            } catch (e) {
                if (loading) loading.remove();
                feed.innerHTML = renderEmpty();
            }
        }

        function bindPostActions() {
            document.querySelectorAll('.like-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.dataset.id;
                    const countEl = btn.querySelector('.like-count');
                    const wasLiked = btn.classList.contains('text-red-500');
                    if (wasLiked) {
                        btn.classList.remove('text-red-500');
                        countEl.textContent = Math.max(0, parseInt(countEl.textContent) - 1);
                    } else {
                        btn.classList.add('text-red-500');
                        countEl.textContent = parseInt(countEl.textContent) + 1;
                    }
                    try { await API.likePost(id); } catch (e) {}
                });
            });

            document.querySelectorAll('.repost-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (typeof showToast !== 'undefined') showToast('转发功能即将上线', 'info');
                });
            });

            document.querySelectorAll('.comment-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (typeof showToast !== 'undefined') showToast('评论功能即将上线', 'info');
                });
            });
        }

        // ========== 发布弹窗 ==========
        const publishModal = document.getElementById('publish-modal');
        const publishContent = document.getElementById('publish-content');
        const publishImage = document.getElementById('publish-image');
        const publishCount = document.getElementById('publish-count');

        function openPublish() {
            API.getMe().then(data => {
                if (!data || !data.user) {
                    if (typeof showToast !== 'undefined') showToast('请先登录', 'error');
                    setTimeout(() => { window.location.href = '/login/'; }, 600);
                    return;
                }
                publishModal.classList.remove('hidden');
                publishModal.classList.add('flex');
                setTimeout(() => publishContent.focus(), 100);
            });
        }

        function closePublish() {
            publishModal.classList.add('hidden');
            publishModal.classList.remove('flex');
        }

        // 监听侧边栏派发的发布事件
        document.addEventListener('open-publish', openPublish);

        publishContent.addEventListener('input', () => {
            publishCount.textContent = `${publishContent.value.length} / 500`;
        });

        document.getElementById('publish-close').addEventListener('click', closePublish);
        publishModal.addEventListener('click', (e) => { if (e.target === publishModal) closePublish(); });

        document.getElementById('publish-submit').addEventListener('click', async () => {
            const content = publishContent.value.trim();
            const imageUrl = publishImage.value.trim() || null;
            if (!content) { if (typeof showToast !== 'undefined') showToast('内容不能为空', 'error'); return; }
            const btn = document.getElementById('publish-submit');
            btn.disabled = true; btn.textContent = '发布中...';
            try {
                const data = await API.createPost(content, imageUrl);
                if (data.success) {
                    publishContent.value = '';
                    publishImage.value = '';
                    publishCount.textContent = '0 / 500';
                    closePublish();
                    if (typeof showToast !== 'undefined') showToast('已发布到龙港', 'success');
                    loadFeed();
                }
            } finally {
                btn.disabled = false; btn.textContent = '发布';
            }
        });

        window.addEventListener('load', loadFeed);
    </script>
</body>
</html>
