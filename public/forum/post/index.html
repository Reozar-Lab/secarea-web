<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帖子详情 · 匿境</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../style.css">
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <style>
        ::-webkit-scrollbar { display: none; }
        html, body { -webkit-text-size-adjust: 100% !important; text-size-adjust: 100% !important; }
        
        .forum-avatar {
            width: 40px !important; height: 40px !important; flex-shrink: 0 !important;
            display: flex !important; align-items: center !important; justify-content: center !important;
            border-radius: 50% !important; font-family: 'Times New Roman', serif !important; font-size: 17px !important;
            background-color: #e5e5ea !important; color: #000000 !important; border: 1px solid #d1d5db !important;
        }
        html.dark .forum-avatar { background-color: #1c1c1e !important; color: #f5d78d !important; border: 1px solid #3f3f46 !important; }
        
        .forum-author-name { color: #000000 !important; font-size: 13px !important; font-weight: bold !important; text-decoration: none !important; }
        html.dark .forum-author-name { color: #ffffff !important; }
        .forum-post-text { color: #111111 !important; font-size: 14px !important; line-height: 1.6 !important; margin: 0 !important; padding: 0 !important; }
        html.dark .forum-post-text { color: #eeeeee !important; }

        .comment-bubble { background-color: #f2f2f7 !important; }
        html.dark .comment-bubble { background-color: #2c2c2e !important; }

        /* 顶栏不再固定，跟随滚动 */
        .forum-top-nav { background-color: #ffffff !important; border-bottom: 1px solid #e5e5ea !important; }
        html.dark .forum-top-nav { background-color: #1c1c1e !important; border-bottom: 1px solid #2c2c2e !important; }
    </style>
</head>
<body class="page-ios min-h-screen flex flex-col relative pb-10">

    <!-- 顶部导航 (随页面滚动) -->
    <div class="w-full pt-14 forum-top-nav h-12 flex items-center px-4 relative">
        <button onclick="window.history.back()" class="flex items-center gap-1 text-[#c89f5d] text-sm font-bold z-10">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            返回
        </button>
        <h1 class="absolute left-1/2 -translate-x-1/2 text-sm font-bold ios-text">帖子详情</h1>
    </div>

    <main class="flex-grow w-full max-w-lg mx-auto">
        <!-- 帖子主内容 -->
        <div id="post-container" class="border-b ios-border p-4">
            <div class="text-center py-10 text-gray-500">加载中...</div>
        </div>

        <!-- 评论列表 -->
        <div class="p-4">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-sm font-bold ios-text">评论 <span id="comment-count" class="text-gray-400 font-normal">0</span></h3>
                <button id="open-comment-modal" class="px-4 py-1.5 bg-[#f5d78d]/20 text-[#c89f5d] text-xs font-bold rounded-full hover:bg-[#f5d78d]/30 transition">
                    写评论
                </button>
            </div>
            
            <div id="comment-list" class="space-y-4">
                <!-- 评论渲染区 -->
            </div>
            <div id="no-comments" class="hidden text-center text-xs text-gray-400 py-6">暂无评论，快来抢沙发吧！</div>
        </div>
    </main>

    <!-- 更多操作菜单 -->
    <div id="more-menu" class="fixed z-[90] hidden">
        <div class="w-36 rounded-xl overflow-hidden shadow-2xl ios-card py-1 border">
            <button data-action="edit" class="more-item hidden w-full text-left px-4 py-2.5 text-sm ios-text hover:bg-black/5 dark:hover:bg-white/5 transition">编辑帖子</button>
            <button data-action="delete" class="more-item hidden w-full text-left px-4 py-2.5 text-sm text-red-500 hover:bg-black/5 dark:hover:bg-white/5 transition">删除帖子</button>
            <button data-action="report" class="more-item hidden w-full text-left px-4 py-2.5 text-sm ios-text hover:bg-black/5 dark:hover:bg-white/5 transition">举报帖子</button>
            <button data-action="cancel" class="more-item w-full text-left px-4 py-2.5 text-sm ios-text opacity-60 hover:bg-black/5 dark:hover:bg-white/5 transition">取消</button>
        </div>
    </div>

    <!-- 底部评论弹窗 (符合个人中心风格) -->
    <div id="comment-modal" class="sys-modal-overlay fixed inset-0 z-[9999] hidden opacity-0 transition-opacity duration-300 flex items-end sm:items-center justify-center">
        <div id="comment-panel" class="sys-modal-panel w-full max-w-lg rounded-t-3xl sm:rounded-3xl shadow-2xl transform translate-y-full sm:translate-y-0 sm:scale-95 transition-transform duration-300 flex flex-col">
            <div class="sys-modal-header sticky top-0 px-4 py-4 flex justify-between items-center z-10 backdrop-blur">
                <h2 class="text-lg font-bold ios-title">发表评论</h2>
                <button onclick="closeCommentModal()" class="ios-text opacity-50 hover:opacity-100 p-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-4 space-y-4">
                <textarea id="comment-input" rows="4" placeholder="发布你的评论..." class="sys-modal-input w-full px-4 py-3 text-sm focus:outline-none focus:border-[#c89f5d] resize-none"></textarea>
                <button id="comment-submit" class="w-full py-3 bg-[#111111] text-[#f5d78d] rounded-xl text-sm font-bold hover:bg-black transition">发送</button>
            </div>
        </div>
    </div>

    <!-- 编辑帖子弹窗 -->
    <div id="edit-post-modal" class="sys-modal-overlay fixed inset-0 z-[80] hidden items-center justify-center">
        <div class="w-[90%] max-w-md rounded-2xl overflow-hidden sys-modal-panel shadow-2xl">
            <div class="px-5 py-3 sys-modal-header flex justify-between items-center">
                <h3 class="font-serif font-bold tracking-widest cec-text-dark text-sm">编辑帖子</h3>
                <button id="edit-post-close" class="ios-text opacity-50 hover:opacity-100 text-xl leading-none">&times;</button>
            </div>
            <div class="p-5 flex flex-col gap-3">
                <textarea id="edit-post-content" rows="5" maxlength="5000" class="w-full px-3 py-2.5 rounded-xl sys-modal-input text-[13px] outline-none resize-none"></textarea>
                <input type="text" id="edit-post-tags" placeholder="标签，用空格分隔" class="w-full px-3 py-2.5 rounded-xl sys-modal-input text-[13px] outline-none">
                <input type="url" id="edit-post-image" placeholder="图片链接（可选）" class="w-full px-3 py-2.5 rounded-xl sys-modal-input text-[13px] outline-none">
                <div class="flex justify-end items-center mt-1">
                    <button id="edit-post-submit" class="px-5 py-2 bg-[#111111] text-[#f5d78d] font-bold rounded-xl hover:bg-[#252525] transition-colors text-[13px] tracking-widest">保存修改</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 举报弹窗 -->
    <div id="report-modal" class="sys-modal-overlay fixed inset-0 z-[80] hidden items-center justify-center">
        <div class="w-[90%] max-w-sm rounded-2xl overflow-hidden sys-modal-panel shadow-2xl">
            <div class="px-5 py-3 sys-modal-header flex justify-between items-center">
                <h3 class="font-serif font-bold tracking-widest text-red-500 text-sm">举报内容</h3>
                <button id="report-close" class="ios-text opacity-50 hover:opacity-100 text-xl leading-none">&times;</button>
            </div>
            <div class="p-5 flex flex-col gap-3">
                <div>
                    <label class="block text-xs text-gray-500 mb-1 ml-1">举报理由（必填）</label>
                    <select id="report-reason" class="w-full px-3 py-2.5 rounded-xl sys-modal-input text-sm outline-none">
                        <option value="垃圾广告">垃圾广告</option>
                        <option value="人身攻击">人身攻击</option>
                        <option value="泄露隐私">泄露隐私</option>
                        <option value="违规内容">违规/违法内容</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1 ml-1">补充说明（选填）</label>
                    <textarea id="report-detail" rows="3" maxlength="100" placeholder="请简述举报原因..." class="w-full px-3 py-2.5 rounded-xl sys-modal-input text-sm outline-none resize-none"></textarea>
                </div>
                <button id="report-submit" class="w-full mt-1 py-2.5 bg-red-500 text-white font-bold rounded-xl hover:bg-red-600 transition-colors text-[13px] tracking-widest">提交举报</button>
            </div>
        </div>
    </div>

    <script src="../../common.js"></script>
    <script src="../../layout.js"></script>
    <script>
        let postId = null;
        let currentUser = null;
        let postAuthorId = null;
        
        // 举报目标（帖子或评论）
        let reportTargetId = null;
        let reportType = null; 

        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
        }

        function timeAgo(ts) {
            const diff = Math.floor((Date.now() - ts) / 1000);
            if (diff < 60) return '刚刚';
            if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
            if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
            return Math.floor(diff / 86400) + ' 天前';
        }

        function roleBadge(role) {
            if (role === 'root') return '<span class="text-[9px] bg-red-500/20 text-red-500 px-1.5 py-0.5 rounded font-bold uppercase ml-2">ROOT</span>';
            if (role === 'admin') return '<span class="text-[9px] bg-yellow-500/20 text-yellow-600 px-1.5 py-0.5 rounded font-bold uppercase ml-2">ADMIN</span>';
            if (role === 'editor') return '<span class="text-[9px] bg-blue-500/20 text-blue-500 px-1.5 py-0.5 rounded font-bold uppercase ml-2">EDITOR</span>';
            return '';
        }

        async function loadPost() {
            const res = await API.getPostDetail(postId);
            const container = document.getElementById('post-container');
            
            if (res.error) {
                container.innerHTML = `<div class="text-center text-red-500 py-10">${res.error}</div>`;
                return;
            }

            const p = res.post;
            postAuthorId = p.author_id;
            const initial = (p.author_name || '?').charAt(0).toUpperCase();

            container.innerHTML = `
                <div class="flex items-start justify-between gap-3 mb-3">
                    <div class="flex items-start gap-3 flex-1">
                        <a href="/profile/index.html?id=${p.author_id}" class="forum-avatar">${escapeHtml(initial)}</a>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center">
                                <a href="/profile/index.html?id=${p.author_id}" class="forum-author-name hover:underline">${escapeHtml(p.author_name)}</a>
                                ${roleBadge(p.author_role)}
                            </div>
                            <span class="text-[11px] ios-text opacity-50 block mt-0.5">${timeAgo(p.created_at)}</span>
                        </div>
                    </div>
                    <button id="detail-more-btn" class="shrink-0 p-1.5 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition">
                        <svg class="w-5 h-5 ios-text opacity-40" fill="currentColor" viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                    </button>
                </div>
                <div class="forum-post-text whitespace-pre-wrap break-words mt-4">${escapeHtml(p.content)}</div>
                ${p.image_url ? `<div class="w-full rounded-xl mt-3 overflow-hidden border ios-border"><img src="${escapeHtml(p.image_url)}" class="w-full h-auto"></div>` : ''}
                
                <div class="flex items-center justify-end gap-6 mt-6 pt-4 border-t ios-border text-[13px] ios-text opacity-50">
                    <button id="btn-detail-comment" class="flex items-center gap-1.5 hover:text-[#c89f5d] hover:opacity-100 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                        <span>${p.comments_count || 0}</span>
                    </button>
                    <button id="btn-detail-favorite" class="flex items-center gap-1.5 transition ${p.favoritedByMe ? 'text-[#c89f5d] opacity-100' : 'hover:text-[#c89f5d] hover:opacity-100'}">
                        <svg class="w-4 h-4" fill="${p.favoritedByMe ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                        <span id="detail-fav-count">${p.favorites_count || 0}</span>
                    </button>
                    <button id="btn-detail-like" class="flex items-center gap-1.5 transition ${p.likedByMe ? 'text-red-500 opacity-100' : 'hover:text-red-500 hover:opacity-100'}">
                        <svg class="w-4 h-4" fill="${p.likedByMe ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                        <span id="detail-like-count">${p.likes_count || 0}</span>
                    </button>
                </div>
            `;

            // 绑定帖子交互
            document.getElementById('btn-detail-comment').addEventListener('click', () => {
                document.getElementById('open-comment-modal').click();
            });

            document.getElementById('btn-detail-like').addEventListener('click', async (e) => {
                e.preventDefault();
                if (!currentUser) return showToast('请先登录', 'error');
                const btn = document.getElementById('btn-detail-like');
                const countEl = document.getElementById('detail-like-count');
                const wasLiked = btn.classList.contains('text-red-500');
                if (wasLiked) {
                    btn.classList.remove('text-red-500', 'opacity-100'); btn.querySelector('svg').setAttribute('fill', 'none'); countEl.textContent = Math.max(0, parseInt(countEl.textContent) - 1);
                } else {
                    btn.classList.add('text-red-500', 'opacity-100'); btn.querySelector('svg').setAttribute('fill', 'currentColor'); countEl.textContent = parseInt(countEl.textContent) + 1;
                }
                await API.toggleLike(postId);
            });

            document.getElementById('btn-detail-favorite').addEventListener('click', async (e) => {
                e.preventDefault();
                if (!currentUser) return showToast('请先登录', 'error');
                const btn = document.getElementById('btn-detail-favorite');
                const countEl = document.getElementById('detail-fav-count');
                const wasFav = btn.classList.contains('text-[#c89f5d]');
                if (wasFav) {
                    btn.classList.remove('text-[#c89f5d]', 'opacity-100'); btn.querySelector('svg').setAttribute('fill', 'none'); countEl.textContent = Math.max(0, parseInt(countEl.textContent) - 1);
                } else {
                    btn.classList.add('text-[#c89f5d]', 'opacity-100'); btn.querySelector('svg').setAttribute('fill', 'currentColor'); countEl.textContent = parseInt(countEl.textContent) + 1;
                }
                await API.toggleFavorite(postId);
            });

            document.getElementById('detail-more-btn').addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                openMoreMenu(e.currentTarget, p);
            });

            // 渲染评论列表
            document.getElementById('comment-count').textContent = res.comments.length;
            
            if (res.comments.length === 0) {
                document.getElementById('no-comments').classList.remove('hidden');
                document.getElementById('comment-list').innerHTML = '';
            } else {
                document.getElementById('no-comments').classList.add('hidden');
                document.getElementById('comment-list').innerHTML = res.comments.map(c => {
                    const cInit = (c.author_name || '?').charAt(0).toUpperCase();
                    const isCommentOwner = currentUser && currentUser.id === c.author_id;
                    const isPostOwner = currentUser && currentUser.id === p.author_id;
                    const isAdmin = currentUser && (currentUser.role === 'admin' || currentUser.role === 'root');
                    
                    const canDelete = isCommentOwner || isPostOwner || isAdmin;
                    const canReport = !isCommentOwner; // 自己不能举报自己
                    
                    return `
                        <div class="flex items-start gap-3">
                            <a href="/profile/index.html?id=${c.author_id}" class="forum-avatar w-8 h-8 !text-[14px]">${escapeHtml(cInit)}</a>
                            <div class="flex-1 comment-bubble p-3 rounded-2xl rounded-tl-none">
                                <div class="flex items-center justify-between mb-1">
                                    <span class="text-[12px] font-bold ios-text">${escapeHtml(c.author_name)}</span>
                                    <div class="flex items-center gap-2">
                                        <span class="text-[10px] text-gray-400">${timeAgo(c.created_at)}</span>
                                        ${canDelete ? `<button onclick="deleteComment('${c.id}')" class="text-[10px] text-red-400 hover:text-red-500 transition">删除</button>` : ''}
                                        ${canReport ? `<button onclick="openReportModal('comment', '${c.id}')" class="text-[10px] text-gray-400 hover:text-gray-600 transition">举报</button>` : ''}
                                    </div>
                                </div>
                                <div class="text-[13px] ios-text whitespace-pre-wrap">${escapeHtml(c.content)}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        // ========== 更多菜单逻辑 ==========
        const moreMenu = document.getElementById('more-menu');
        let currentPostData = null;
        
        function openMoreMenu(anchorBtn, post) {
            currentPostData = post;
            const isOwner = currentUser && currentUser.id === postAuthorId;
            const isAdmin = currentUser && (currentUser.role === 'admin' || currentUser.role === 'root');

            const rect = anchorBtn.getBoundingClientRect();
            moreMenu.style.top = `${rect.bottom + 6}px`;
            moreMenu.style.right = `${window.innerWidth - rect.right}px`;
            moreMenu.classList.remove('hidden');

            moreMenu.querySelectorAll('.more-item').forEach(item => {
                item.classList.add('hidden');
                const action = item.dataset.action;
                if (action === 'edit' && isOwner) item.classList.remove('hidden');
                if (action === 'delete' && (isOwner || isAdmin)) item.classList.remove('hidden');
                if (action === 'report' && !isOwner) item.classList.remove('hidden');
                if (action === 'cancel') item.classList.remove('hidden');
            });
        }

        moreMenu.addEventListener('click', async (e) => {
            const item = e.target.closest('.more-item');
            if (!item) return;
            const action = item.dataset.action;
            moreMenu.classList.add('hidden');
            
            if (action === 'edit') {
                document.getElementById('edit-post-content').value = currentPostData.content;
                document.getElementById('edit-post-tags').value = currentPostData.tags || '';
                document.getElementById('edit-post-image').value = currentPostData.image_url || '';
                document.getElementById('edit-post-modal').classList.remove('hidden');
                document.getElementById('edit-post-modal').classList.add('flex');
            } else if (action === 'delete') {
                if (confirm('确定要删除这条帖子吗？删除后将无法恢复。')) {
                    const res = await API.deletePost(postId);
                    if (res.success) {
                        showToast('帖子已删除', 'success');
                        setTimeout(() => { window.location.href = '/forum/'; }, 1000);
                    }
                }
            } else if (action === 'report') {
                if (!currentUser) return showToast('请先登录', 'error');
                openReportModal('post', postId);
            }
        });

        document.addEventListener('click', (e) => {
            if (!moreMenu.contains(e.target) && !e.target.closest('#detail-more-btn')) moreMenu.classList.add('hidden');
        });

        // ========== 举报弹窗逻辑 ==========
        function openReportModal(type, targetId) {
            reportType = type;
            reportTargetId = targetId;
            document.getElementById('report-reason').value = "垃圾广告";
            document.getElementById('report-detail').value = "";
            document.getElementById('report-modal').classList.remove('hidden');
            document.getElementById('report-modal').classList.add('flex');
        }

        document.getElementById('report-close').addEventListener('click', () => {
            document.getElementById('report-modal').classList.add('hidden');
            document.getElementById('report-modal').classList.remove('flex');
        });

        document.getElementById('report-submit').addEventListener('click', async (e) => {
            const reason = document.getElementById('report-reason').value;
            const detail = document.getElementById('report-detail').value.trim();
            const btn = e.target;
            btn.disabled = true;
            btn.textContent = '提交中...';

            let res;
            if (reportType === 'post') {
                res = await API.reportPost(reportTargetId, reason, detail);
            } else {
                res = await API.reportComment(reportTargetId, reason, detail);
            }
            
            if (!res.error) {
                document.getElementById('report-modal').classList.add('hidden');
                document.getElementById('report-modal').classList.remove('flex');
            }
            btn.disabled = false;
            btn.textContent = '提交举报';
        });

        // ========== 编辑帖子弹窗逻辑 ==========
        document.getElementById('edit-post-close').addEventListener('click', () => {
            document.getElementById('edit-post-modal').classList.add('hidden');
            document.getElementById('edit-post-modal').classList.remove('flex');
        });

        document.getElementById('edit-post-submit').addEventListener('click', async (e) => {
            const content = document.getElementById('edit-post-content').value.trim();
            const tagsStr = document.getElementById('edit-post-tags').value.trim();
            const imageUrl = document.getElementById('edit-post-image').value.trim() || null;
            const tags = tagsStr ? tagsStr.split(/\s+/) : [];

            if (!content) return showToast('内容不能为空', 'error');

            const btn = e.target;
            btn.disabled = true;
            btn.textContent = '保存中...';

            const res = await API.editPost(postId, content, imageUrl, 'discussion', tags);
            if (res.success) {
                document.getElementById('edit-post-modal').classList.add('hidden');
                document.getElementById('edit-post-modal').classList.remove('flex');
                loadPost(); // 重新加载
            }
            btn.disabled = false;
            btn.textContent = '保存修改';
        });

        // ========== 评论弹窗逻辑 ==========
        const commentModal = document.getElementById('comment-modal');
        const commentPanel = document.getElementById('comment-panel');
        const commentInput = document.getElementById('comment-input');

        document.getElementById('open-comment-modal').addEventListener('click', () => {
            if (!currentUser) return showToast('请先登录', 'error');
            commentModal.classList.remove('hidden');
            setTimeout(() => {
                commentModal.classList.remove('opacity-0');
                commentPanel.classList.remove('translate-y-full', 'sm:scale-95');
                commentInput.focus();
            }, 10);
        });

        function closeCommentModal() {
            commentModal.classList.add('opacity-0');
            commentPanel.classList.add('translate-y-full', 'sm:scale-95');
            setTimeout(() => commentModal.classList.add('hidden'), 300);
        }

        commentModal.addEventListener('click', (e) => { 
            if (e.target === commentModal) closeCommentModal(); 
        });

        document.getElementById('comment-submit').addEventListener('click', async () => {
            const content = commentInput.value.trim();
            if (!content) return;

            const btn = document.getElementById('comment-submit');
            btn.disabled = true;
            btn.textContent = '发送中...';

            const res = await API.addComment(postId, content);
            if (res.success) {
                commentInput.value = '';
                closeCommentModal();
                loadPost();
            }
            
            btn.disabled = false;
            btn.textContent = '发送';
        });

        // ========== 删评逻辑 ==========
        window.deleteComment = async function(commentId) {
            if (!confirm("确定删除这条评论吗？")) return;
            const res = await API.deleteComment(commentId);
            if (res.success) {
                showToast("评论已删除", "success");
                loadPost();
            }
        };

        window.addEventListener('load', async () => {
            postId = getQueryParam('id');
            if (!postId) {
                document.getElementById('post-container').innerHTML = '<div class="text-center py-10">非法访问</div>';
                return;
            }
            const me = await API.getMe();
            if (me && me.user) currentUser = me.user;
            loadPost();
        });
    </script>
</body>
</html>
